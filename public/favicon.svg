<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Emerald to Cyan Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#neonGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- Circuit Trace Nodes on the Left/Top -->
  <g stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 14 26 L 19 26 L 24 20" />
    <path d="M 12 34 L 18 34 L 21 38" />
    <path d="M 20 15 L 26 15 L 30 19" />
  </g>
  <circle cx="14" cy="26" r="1.8" fill="#34d399" />
  <circle cx="12" cy="34" r="1.8" fill="#06b6d4" />
  <circle cx="20" cy="15" r="1.8" fill="#10b981" />

  <!-- Isometric Isometric Central Cube Frame -->
  <!-- Top Face -->
  <polygon points="32,14 46,22 32,30 18,22" fill="#13232a" stroke="url(#neonGrad)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Left Face -->
  <polygon points="18,22 32,30 32,48 18,40" fill="#0c1920" stroke="url(#neonGrad)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Right Face -->
  <polygon points="32,30 46,22 46,40 32,48" fill="#0a1d24" stroke="url(#neonGrad)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Top Isometric Y Divider / Inner Accent -->
  <path d="M 32,30 L 32,20" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 32,20 L 25,16" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 32,20 L 39,16" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Terminal Prompt Chevron & Cursor on Front Face -->
  <path d="M 36,33 L 40,36.5 L 36,40" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="42" y1="41" x2="45" y2="41" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
</svg>
